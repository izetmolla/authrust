[package]
name = "authrust"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "Framework-agnostic authentication and authorization for Rust, built on http + tower"
license = "MIT OR Apache-2.0"
authors = ["Izet Molla"]
repository = "https://github.com/izetmolla/authrust"
homepage = "https://github.com/izetmolla/authrust"
documentation = "https://docs.rs/authrust"
readme = "README.md"
keywords = ["authentication", "oauth2", "oidc", "jwt", "tower"]
categories = ["authentication", "web-programming"]
# The example apps under examples/ are standalone workspace members, not cargo
# example targets of this package.
autoexamples = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[workspace]
members = ["examples/axum", "examples/actix"]

[dependencies]
async-trait = "0.1.91"
axum = { version = "0.8.9", optional = true }
base64 = "0.23.0"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
cookie = "0.18.1"
form_urlencoded = "1.2.2"
futures-util = "0.3.33"
hex = "0.4.3"
hmac = "0.13.0"
http = "1.5.0"
http-body = "1.1.0"
http-body-util = "0.1.4"
# `rust_crypto` selects the pure-Rust signing backend; jsonwebtoken 11 panics at
# runtime unless exactly one provider feature is enabled.
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }
ldap3 = { version = "0.12.1", default-features = false, features = ["tls-rustls-ring"] }
percent-encoding = "2.3.2"
pin-project-lite = "0.2.17"
rand = "0.10.2"
redis = { version = "1.5.0", default-features = false, features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider", "json", "form", "charset", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json"] }
subtle = "2.6.1"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tower-layer = "0.3.3"
tower-service = "0.3.3"
url = "2.5.8"
uuid = { version = "1.24.0", features = ["v4", "serde"] }

[dev-dependencies]
bytes = "1.12.1"
dotenvy = "0.15"
http = "1.5.0"
http-body-util = "0.1.4"
redis = { version = "1.5.0", default-features = false, features = ["tokio-comp", "connection-manager"] }
serde_json = "1.0.151"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json"] }
tokio = { version = "1.53.1", features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }
uuid = { version = "1.24.0", features = ["v4"] }

[features]
default = ["axum"]
axum = ["dep:axum"]

# PBKDF2 runs 600k HMAC-SHA256 iterations; unoptimised hashing makes the test
# suite take minutes, so the crypto crates are always built with optimisations.
[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.hmac]
opt-level = 3
