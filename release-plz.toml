# https://release-plz.dev/docs/config
#
# Version bumps follow Conventional Commits + cargo-semver-checks:
#   fix:     → patch
#   feat:    → minor
#   BREAKING → major (minor while on 0.x)

[workspace]
# Example crates already have `publish = false` and are skipped.

[[package]]
name = "authrust"
# GitHub release / tag style: v0.1.1 (instead of authrust-v0.1.1)
git_tag_name = "v{{ version }}"
git_release_name = "v{{ version }}"

[[package]]
name = "authrust-axum-example"
release = false

[[package]]
name = "authrust-actix-example"
release = false
