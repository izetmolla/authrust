[package]
name = "authrust-actix-example"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
authrust = { path = "../..", default-features = false }
actix-web = "4.11.0"
bytes = "1.12.1"
http = "1.5.0"
http-body-util = "0.1.4"
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres"] }
