# Release automation with release-plz (https://release-plz.dev).
#
# Version bumps from Conventional Commits:
#   fix:  → patch   |  feat: → minor  |  feat!: / BREAKING CHANGE → major
#
# One-time GitHub setup (required or jobs fail):
#   1. Settings → Actions → General → Workflow permissions:
#        - Read and write permissions
#        - Allow GitHub Actions to create and approve pull requests  ← needed for release PRs
#   2. Settings → Secrets → Actions → add CARGO_REGISTRY_TOKEN
#        (crates.io token with publish-update / publish-new)

name: Release-plz

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  # Publish crates already version-bumped on main but not yet on crates.io.
  release-plz-release:
    name: Release-plz release
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'izetmolla' }}
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Ensure crates.io token is configured
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::Missing secret CARGO_REGISTRY_TOKEN. Add a crates.io API token under Settings → Secrets → Actions."
            exit 1
          fi

      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Open/update a single release PR for the next version.
  release-plz-pr:
    name: Release-plz PR
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'izetmolla' }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Delete orphan release-plz branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Orphans appear when PR creation fails (usually missing
          # "Allow GitHub Actions to create and approve pull requests").
          mapfile -t branches < <(git ls-remote --heads origin 'release-plz-*' | awk '{print $2}' | sed 's#refs/heads/##')
          if [ "${#branches[@]}" -eq 0 ]; then
            echo "No release-plz branches found."
            exit 0
          fi
          for branch in "${branches[@]}"; do
            pr="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty' || true)"
            if [ -n "$pr" ]; then
              echo "Keeping origin/${branch} (open PR #${pr})"
              continue
            fi
            echo "Deleting orphan origin/${branch}"
            git push origin --delete "$branch"
          done

      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
