# Release automation with release-plz (https://release-plz.dev).
#
# Version bumps from Conventional Commits:
#   fix:  → patch   |  feat: → minor  |  feat!: / BREAKING CHANGE → major
#
# One-time GitHub setup (required or jobs fail):
#   1. Settings → Actions → General → Workflow permissions:
#        - Read and write permissions
#        - Allow GitHub Actions to create and approve pull requests  ← needed for release PRs
#   2. Settings → Secrets → Actions → add CARGO_REGISTRY_TOKEN
#        (crates.io token with publish-update / publish-new)

name: Release-plz

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# Broad enough for release-plz to open PRs and push tags.
permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  # Publish crates already version-bumped on main but not yet on crates.io.
  release-plz-release:
    name: Release-plz release
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'izetmolla' }}
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Ensure crates.io token is configured
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::Missing secret CARGO_REGISTRY_TOKEN. Add a crates.io API token under Settings → Secrets → Actions."
            exit 1
          fi

      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Open/update a PR that bumps patch/minor/major + CHANGELOG for the next release.
  release-plz-pr:
    name: Release-plz PR
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'izetmolla' }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # Needed so release-plz can push the release branch with GITHUB_TOKEN.
          persist-credentials: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
